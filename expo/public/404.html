<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 – DailyChefMate</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #FAFAF9;
      --surface: #FFFFFF;
      --border: #E8E7E4;
      --text: #1B1A18;
      --muted: #57554F;
      --accent: #D6482F;
      --on-accent: #FFFFFF;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --surface: #201E1C;
        --border: #322F2C;
        --text: #F5F4F1;
        --muted: #B5B2AC;
        --accent: #F0603F;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .emoji { font-size: 48px; line-height: 1; }
    .code {
      margin-top: 14px;
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
    .brand {
      margin-top: 4px;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin-top: 20px;
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    p {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 24px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .btn:active { opacity: 0.85; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🍳</div>
    <div class="code">404</div>
    <div class="brand">DailyChefMate</div>

    <div data-lang="de">
      <h1>Seite nicht gefunden</h1>
      <p>Diese Seite gibt es nicht (mehr). Vielleicht wurde sie verschoben oder der Link ist veraltet.</p>
    </div>
    <div data-lang="en">
      <h1>Page not found</h1>
      <p>This page doesn&rsquo;t exist (anymore). It may have moved, or the link is out of date.</p>
    </div>

    <a class="btn" href="/" data-lang="de">Zur Startseite</a>
    <a class="btn" href="/" data-lang="en">Go to homepage</a>
  </main>

  <script>
    (function () {
      try {
        var lang = (navigator.language || "en").toLowerCase().indexOf("de") === 0 ? "de" : "en";
        document.documentElement.lang = lang;
        var nodes = document.querySelectorAll("[data-lang]");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].hidden = nodes[i].getAttribute("data-lang") !== lang;
        }
      } catch (e) { /* no JS / blocked: both languages stay visible */ }
    })();
  </script>
</body>
</html>
