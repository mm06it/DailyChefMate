<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>DailyChefMate</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2D3748;
      background: linear-gradient(160deg, #FFDEE2 0%, #FFFFFF 45%, #D0F4FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border: 1px solid #F0E6E6;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(45, 55, 72, 0.10);
    }
    .emoji { font-size: 52px; line-height: 1; }
    .brand {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #FF6B6B;
      text-transform: none;
    }
    h1 {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 800;
      color: #2D3748;
    }
    p {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.6;
      color: #8A94A6;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 26px;
      border-radius: 999px;
      background: #FF6B6B;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:active { opacity: 0.85; }
    [data-lang] + [data-lang] { margin-top: 6px; }
    /* When JS picks a language, the other block is hidden via [hidden]. */
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🍳</div>
    <div class="brand">DailyChefMate</div>

    <div data-lang="de">
      <h1>Website in Bearbeitung</h1>
      <p>Wir sind gleich wieder für dich da. Bitte versuche es in ein paar Minuten erneut.</p>
    </div>
    <div data-lang="en">
      <h1>We&rsquo;ll be right back</h1>
      <p>We&rsquo;re doing a bit of maintenance. Please try again in a few minutes.</p>
    </div>

    <a class="btn" href="/" data-lang="de">Neu laden</a>
    <a class="btn" href="/" data-lang="en">Reload</a>
  </main>

  <script>
    (function () {
      try {
        var lang = (navigator.language || "en").toLowerCase().indexOf("de") === 0 ? "de" : "en";
        document.documentElement.lang = lang;
        var nodes = document.querySelectorAll("[data-lang]");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].hidden = nodes[i].getAttribute("data-lang") !== lang;
        }
      } catch (e) { /* no JS / blocked: both languages stay visible */ }
    })();
  </script>
</body>
</html>
